<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セルフケアシート（K-STEP）</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      background-color: #f8f9fa;
      color: #000;
    }
    h1 { text-align: center; font-size: 1.2rem; margin-bottom: 16px; }

    /* 操作カード（スマホ用・印刷時は非表示） */
    .control-card {
      background: white; padding: 16px; border-radius: 8px;
      border: 1px solid #ccc; margin-bottom: 20px;
    }
    .control-card h2 { font-size: 1rem; margin-top: 0; margin-bottom: 10px; }

    .step-buttons { display: flex; gap: 6px; margin-bottom: 12px; }
    .btn-step {
      flex: 1; padding: 8px; border: 1px solid #333; border-radius: 4px;
      background: white; font-weight: bold; cursor: pointer; font-size: 0.9rem; text-align: center;
    }
    .btn-step.active-green { background: #ddd; }
    .btn-step.active-yellow { background: #ccc; }
    .btn-step.active-red { background: #bbb; }

    .section-title { font-weight: bold; font-size: 0.85rem; margin-top: 10px; margin-bottom: 4px; color: #333; }
    .checkbox-group { display: flex; flex-direction: column; gap: 4px; max-height: 130px; overflow-y: auto; border: 1px solid #eee; padding: 6px; background: #fafafa; border-radius: 4px; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; }

    textarea {
      width: 100%; height: 50px; border: 1px solid #888; border-radius: 4px;
      padding: 6px; box-sizing: border-box; font-size: 0.85rem; resize: none; margin-top: 4px;
    }
    .btn-action {
      width: 100%; padding: 10px; border: 1px solid #333; border-radius: 4px;
      font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-top: 12px; background: #333; color: white;
    }
    .btn-print { background: #fff; color: #333; border: 1px solid #333; margin-bottom: 10px; padding: 8px 16px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

    /* 🖨️ 画像のレイアウトを再現したK-STEP原本風テーブル */
    .sheet-container {
      background: white; padding: 16px; border: 1px solid #333;
    }
    .sheet-title {
      text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; letter-spacing: 1px;
    }
    .kstep-grid {
      width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: center;
    }
    .kstep-grid th, .kstep-grid td {
      border: 1px solid #333; padding: 4px 2px; vertical-align: middle; height: 24px;
    }
    .kstep-grid th { background: #eee; font-weight: bold; }
    .col-day { width: 35px; }
    .col-data { text-align: left; padding-left: 4px; font-size: 0.7rem; }

    /* 🖨️ 印刷用設定（A4・モノクロ） */
    @media print {
      body { background: white; max-width: 100%; padding: 0; }
      .no-print { display: none !important; }
      .sheet-container { border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <h1 class="no-print">K-STEP セルフケアシート（自動記録版）</h1>

  <!-- 今日の記録入力フォーム（スマホ操作用） -->
  <div class="control-card no-print">
    <h2>今日のチェックイン</h2>
    
    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
      <label style="font-size: 0.85rem; font-weight: bold;">記録する日付:</label>
      <select id="select-day" style="flex: 1; padding: 6px; border-radius: 4px; border: 1px solid #888; font-size: 0.9rem;"></select>
    </div>

    <!-- ステータス（状態のベース）選択 -->
    <div style="font-size: 0.85rem; font-weight: bold; margin-bottom: 4px;">本日の状態を選択：</div>
    <div class="step-buttons">
      <button class="btn-step" id="btn-green" onclick="switchStep('green')">🟢 良好</button>
      <button class="btn-step" id="btn-yellow" onclick="switchStep('yellow')">🟡 注意</button>
      <button class="btn-step" id="btn-red" onclick="switchStep('red')">🔴 悪化</button>
    </div>

    <!-- サイン選択エリア -->
    <div class="section-title" id="signs-label">当てはまるサイン：</div>
    <div class="checkbox-group" id="checkbox-signs"></div>

    <!-- セルフケア選択エリア -->
    <div class="section-title">実践したセルフケア（対処法）：</div>
    <div class="checkbox-group" id="checkbox-actions"></div>

    <!-- 備考欄 -->
    <div class="section-title">備考（服薬情報・引き金など）：</div>
    <textarea id="memo" placeholder="例：服薬あり、睡眠6時間、雨天など"></textarea>

    <button class="btn-action" onclick="saveLog()">この日のデータを保存する</button>
  </div>

  <!-- 主治医提出用 印刷エリア（原本の形式を完全再現） -->
  <div class="sheet-container">
    <div style="display: flex; justify-content: space-between; align-items: center;" class="no-print">
      <span style="font-size: 0.85rem; font-weight: bold; color: #555;">プレビュー / 主治医確認用</span>
      <button class="btn-print" onclick="window.print()">🖨️ 白黒印刷 / PDF保存</button>
    </div>

    <div class="sheet-title">セルフケアシート（K - STEP）</div>

    <table class="kstep-grid">
      <thead>
        <tr>
          <th class="col-day">月</th>
          <th>良好サイン</th>
          <th>注意サイン</th>
          <th>悪化サイン</th>
          <th>セルフケア</th>
          <th style="width: 120px;">備考<br><span style="font-size:0.65rem; font-weight:normal;">～服薬情報・引き金など～</span></th>
        </tr>
      </thead>
      <tbody id="grid-body">
        <!-- 1日〜31日の行をJavaScriptで自動生成 -->
      </tbody>
    </table>
  </div>

  <script>
    // 各状態のサインおよびセルフケアのマスターデータ
    const careData = {
      green: {
        title: "良好サイン",
        signs: ["笑顔・許せる", "考えて話せる", "体が軽い"],
        actions: ["今の良いリズムを維持する", "好きな趣味の時間を少し持つ", "適度な水分補給"]
      },
      yellow: {
        title: "注意サイン",
        signs: ["ミス増加", "肩こりや頭痛", "イライラしやすい", "ブレインフォグ", "集中低下", "選べない", "疲労感"],
        actions: ["作業場所を移動する", "他の作業に切り替える", "ストレッチや深呼吸をする", "業務量を調整する"]
      },
      red: {
        title: "悪化サイン",
        signs: ["めまい", "下痢", "熱", "寝落ち"],
        actions: ["無理せず仕事を休む/セーブする", "家族や医師に相談する", "スマホを置いて静かに横になる"]
      }
    };

    let currentStep = 'green';

    // 日付セレクトボックスの初期化（1日〜31日）
    function initDaySelect() {
      const select = document.getElementById('select-day');
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `${i}日`;
        select.appendChild(opt);
      }
      select.value = new Date().getDate();
    }

    // ステータス（良好・注意・悪化）切り替え時に、対応するチェックボックスを描画
    function switchStep(step) {
      currentStep = step;
      document.getElementById('btn-green').className = 'btn-step' + (step === 'green' ? ' active-green' : '');
      document.getElementById('btn-yellow').className = 'btn-step' + (step === 'yellow' ? ' active-yellow' : '');
      document.getElementById('btn-red').className = 'btn-step' + (step === 'red' ? ' active-red' : '');

      // サインのチェックボックス生成
      const signsContainer = document.getElementById('checkbox-signs');
      signsContainer.innerHTML = '';
      careData[step].signs.forEach(sign => {
        signsContainer.innerHTML += `
          <label class="checkbox-item">
            <input type="checkbox" name="sign_check" value="${sign}">
            <span>${sign}</span>
          </label>
        `;
      });
      document.getElementById('signs-label').innerText = `${careData[step].title} から選択：`;

      // セルフケアのチェックボックス生成（全種類から選べるようにするか、該当ステップのものにするか選択可能）
      const actionsContainer = document.getElementById('checkbox-actions');
      actionsContainer.innerHTML = '';
      
      // 全てのセルフケア選択肢をまとめて選べるようにする（または現在のステップのもの）
      const allActions = [...careData.green.actions, ...careData.yellow.actions, ...careData.red.actions];
      // 重複排除
      const uniqueActions = Array.from(new Set(allActions));

      uniqueActions.forEach(action => {
        // 現在のステップに含まれるものはデフォルトでチェックしやすくするかは任意
        actionsContainer.innerHTML += `
          <label class="checkbox-item">
            <input type="checkbox" name="action_check" value="${action}">
            <span>${action}</span>
          </label>
        `;
      });
    }

    // 印刷用グリッド（1日〜31日分の表）の生成
    function initGridTable() {
      const tbody = document.getElementById('grid-body');
      const savedLogs = JSON.parse(localStorage.getItem('kstep_sheet_logs_v2') || '{}');
      
      let html = '';
      for (let day = 1; day <= 31; day++) {
        const log = savedLogs[day] || { green: [], yellow: [], red: [], actions: [], memo: '' };
        
        const greenText = log.green.join(', ');
        const yellowText = log.yellow.join(', ');
        const redText = log.red.join(', ');
        const actionText = log.actions ? log.actions.join(', ') : '';

        html += `
          <tr>
            <td><strong>${day}日</strong></td>
            <td class="col-data">${greenText}</td>
            <td class="col-data">${yellowText}</td>
            <td class="col-data">${redText}</td>
            <td class="col-data">${actionText}</td>
            <td class="col-data">${log.memo || ''}</td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    // データの保存
    function saveLog() {
      const day = document.getElementById('select-day').value;
      const checkedSigns = Array.from(document.querySelectorAll('input[name="sign_check"]:checked')).map(cb => cb.value);
      const checkedActions = Array.from(document.querySelectorAll('input[name="action_check"]:checked')).map(cb => cb.value);
      const memo = document.getElementById('memo').value;

      let savedLogs = JSON.parse(localStorage.getItem('kstep_sheet_logs_v2') || '{}');
      
      if (!savedLogs[day]) {
        savedLogs[day] = { green: [], yellow: [], red: [], actions: [], memo: '' };
      }

      // 選択したステップのサインを格納
      savedLogs[day][currentStep] = checkedSigns;
      
      // セルフケアは既存のものに追加、または上書き（ここでは選択されたものを保存）
      if (checkedActions.length > 0) {
        savedLogs[day].actions = checkedActions;
      }
      if (memo) {
        savedLogs[day].memo = memo;
      }

      localStorage.setItem('kstep_sheet_logs_v2', JSON.stringify(savedLogs));

      alert(`${day}日の記録を保存しました！`);
      initGridTable();
    }

    // 初期化実行
    initDaySelect();
    switchStep('green');
    initGridTable();
  </script>
</body>
</html>
